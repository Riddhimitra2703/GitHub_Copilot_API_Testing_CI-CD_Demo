[pytest]
addopts =
    --alluredir=reports/allure-report
    --html=reports/html-report/report.html --self-contained-html
    -ra
markers =
    smoke: smoke test coverage for critical API flows
    regression: regression coverage for repeated API behavior
    crud: create/read/update/delete validation coverage
log_cli = true
log_cli_level = INFO
log_file = logs/pytest_api.log
log_file_level = INFO

# videos/ is reserved for future UI-hybrid runs even though this suite is API-only.
